<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gesture Planet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #webcam {
      position: fixed; bottom: 14px; right: 14px;
      width: 140px; height: 105px;
      border-radius: 8px; opacity: 0.5;
      transform: scaleX(-1);
      border: 1px solid rgba(255,130,30,0.2);
      pointer-events: none;
    }
    #hud {
      position: fixed; top: 18px; left: 22px;
      font: 700 11px/2.2 'Courier New', monospace;
      color: rgba(255,155,50,0.5);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font: 11px 'Courier New', monospace;
      color: rgba(255,255,255,0.13);
      letter-spacing: 0.09em;
      white-space: nowrap;
      pointer-events: none;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      background: #000; z-index: 99;
      font: 12px 'Courier New', monospace;
      color: rgba(255,140,40,0.65);
      letter-spacing: 0.1em;
      transition: opacity 0.7s;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 2px solid rgba(255,110,20,0.15);
      border-top-color: rgba(255,110,20,0.9);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="load-text">Loading…</div>
</div>

<video id="webcam" autoplay playsinline muted></video>
<div id="hud">
  Gesture Planet<br>
  <span id="g-label">—</span><br>
  <span id="g-dist"></span>
</div>
<div id="hint">✊ 握拳拉远 · 🖐 张手靠近 · 🤚 旋转</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ── Renderer ──────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000308);

const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
});

// ── Camera orbit ──────────────────────────────────────────────────
let camTheta  = 0.25;
let camPhi    = 1.25;
let camRadius = 22;
const CAM_MIN = 9, CAM_MAX = 70;

function positionCam() {
  cam.position.set(
    camRadius * Math.sin(camPhi) * Math.cos(camTheta),
    camRadius * Math.cos(camPhi),
    camRadius * Math.sin(camPhi) * Math.sin(camTheta)
  );
  cam.lookAt(0, 0, 0);
}
positionCam();

// ── Shared shader ─────────────────────────────────────────────────
const VERT = `
  attribute vec3  aCol;
  attribute float aSz;
  varying   vec3  vCol;
  void main(){
    vCol = aCol;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSz * (420.0 / -mv.z);
    gl_Position  = projectionMatrix * mv;
  }
`;
const FRAG = `
  varying vec3 vCol;
  void main(){
    vec2  uv = gl_PointCoord - 0.5;
    float d  = dot(uv, uv) * 4.0;
    if (d > 1.0) discard;
    float a  = pow(1.0 - d, 1.5) * 0.98;
    gl_FragColor = vec4(vCol, a);
  }
`;
const sharedMat = new THREE.ShaderMaterial({
  transparent   : true,
  depthWrite    : false,
  blending      : THREE.AdditiveBlending,
  vertexShader  : VERT,
  fragmentShader: FRAG,
});

function buildPoints(pos, col, siz) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCol',     new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSz',      new THREE.BufferAttribute(siz, 1));
  return new THREE.Points(geo, sharedMat);
}

// ── Planet ────────────────────────────────────────────────────────
const PR = 5;   // planet radius
let planetMesh;

(function () {
  const N   = 22000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const roll = Math.random();
    let r;
    // 82 % tightly on surface shell, 12 % interior, 6 % outer haze
    if      (roll < 0.82) r = PR * (0.93 + Math.random() * 0.10);
    else if (roll < 0.94) r = PR * (0.30 + Math.random() * 0.63);
    else                  r = PR * (1.03 + Math.random() * 0.18);

    const u = Math.random() * 2 * Math.PI;
    const v = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(v) * Math.cos(u);
    pos[i*3+1] = r * Math.cos(v);
    pos[i*3+2] = r * Math.sin(v) * Math.sin(u);

    // Color: inner core = yellow-white, mid = bright orange, surface = deep orange
    const n  = r / PR;                                  // 0 … ~1.2
    const rr = 1.0;
    const gg = n < 0.5 ? 0.85 - n * 0.5               // core: warm white
             : Math.max(0.1, 0.85 - (n - 0.5) * 1.5); // surface: orange→dark
    const bb = n < 0.4 ? 0.55 - n * 1.0 : 0.0;        // core bluish-white tint

    const brightness = roll < 0.82 ? (0.75 + Math.random() * 0.25)
                                   : (0.4  + Math.random() * 0.4);
    col[i*3]   = rr * brightness;
    col[i*3+1] = gg * brightness;
    col[i*3+2] = bb * brightness;

    // Surface particles larger, core smaller
    siz[i] = roll < 0.82 ? (2.5 + Math.random() * 3.5)
           : roll < 0.94  ? (1.0 + Math.random() * 2.0)
           :                 (1.5 + Math.random() * 2.5);
  }

  planetMesh = buildPoints(pos, col, siz);
  scene.add(planetMesh);
})();

// ── Atmosphere ────────────────────────────────────────────────────
for (const [scale, opacity, color] of [
  [1.35, 0.06, 0xff4400],
  [1.15, 0.10, 0xff6600],
  [0.92, 0.09, 0xff2200],
]) {
  const geo = new THREE.SphereGeometry(PR * scale, 32, 32);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    side: THREE.BackSide, depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Mesh(geo, mat));
}

// ── Rings ─────────────────────────────────────────────────────────
// Like Saturn: flat disc, two bands, particles evenly distributed radially
function buildRing({ rMin, rMax, tiltX, tiltZ, count, cr, cg, cb }) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    // More particles near ring edges (denser bands)
    const t   = Math.random();
    const rad = rMin + t * (rMax - rMin);
    // Very thin vertical spread (flat disc)
    const h   = (Math.random() - 0.5) * 0.08;

    pos[i*3]   = rad * Math.cos(angle);
    pos[i*3+1] = h;
    pos[i*3+2] = rad * Math.sin(angle);

    // Brightness varies: brighter toward inner edge
    const edgeFactor = 1 - t * 0.5;
    const br  = (0.55 + Math.random() * 0.45) * edgeFactor;
    col[i*3]   = cr * br;
    col[i*3+1] = cg * br;
    col[i*3+2] = cb * br;

    siz[i] = 1.2 + Math.random() * 2.8;
  }
  const mesh = buildPoints(pos, col, siz);
  mesh.rotation.x = tiltX;
  mesh.rotation.z = tiltZ;
  return mesh;
}

// Inner ring — warm white
scene.add(buildRing({
  rMin: PR * 1.45, rMax: PR * 2.20,
  tiltX: 0.38, tiltZ: 0.05,
  count: 8000, cr: 1.0, cg: 0.97, cb: 0.90,
}));
// Outer ring — cool white-blue, slightly different tilt
scene.add(buildRing({
  rMin: PR * 2.45, rMax: PR * 3.10,
  tiltX: 0.42, tiltZ: 0.08,
  count: 6000, cr: 0.85, cg: 0.90, cb: 1.0,
}));

// ── Starfield ─────────────────────────────────────────────────────
{
  const N   = 5000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 * Math.PI;
    const v = Math.acos(2 * Math.random() - 1);
    const r = 140 + Math.random() * 60;
    pos[i*3]   = r * Math.sin(v) * Math.cos(u);
    pos[i*3+1] = r * Math.cos(v);
    pos[i*3+2] = r * Math.sin(v) * Math.sin(u);
    const br = 0.3 + Math.random() * 0.7;
    col[i*3] = col[i*3+1] = col[i*3+2] = br;
    siz[i]   = 0.3 + Math.random() * 1.0;
  }
  scene.add(buildPoints(pos, col, siz));
}

// ── Gesture state ─────────────────────────────────────────────────
let curGesture  = 'none';
let prevGesture = 'none';
let gestureTime = 0;
let prevAngle   = null;

const gLabel = document.getElementById('g-label');
const gDist  = document.getElementById('g-dist');

function isExtended(lm, tip, pip) { return lm[tip].y < lm[pip].y; }

function classify(lm) {
  const n = [
    isExtended(lm, 8,  6),
    isExtended(lm, 12, 10),
    isExtended(lm, 16, 14),
    isExtended(lm, 20, 18),
  ].filter(Boolean).length;
  if (n <= 1) return 'fist';
  if (n >= 4) return 'open';
  return 'rotate';
}

function palmAngle(lm) {
  return Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x);
}

function onResults(res) {
  if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
    curGesture = 'none';
    prevAngle  = null;
    gLabel.textContent = '—';
    return;
  }
  const lm = res.multiHandLandmarks[0];
  curGesture = classify(lm);

  if (curGesture === 'rotate') {
    const a = palmAngle(lm);
    if (prevAngle !== null) {
      let d = a - prevAngle;
      if (d >  Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      camTheta -= d * 2.8;
    }
    prevAngle = a;
  } else {
    prevAngle = null;
  }

  const labels = { fist: '✊ 拉远', open: '🖐 靠近', rotate: '🤚 旋转' };
  gLabel.textContent = labels[curGesture] || '—';
}

// ── Render loop ───────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (curGesture !== prevGesture) gestureTime = 0;
  else gestureTime += dt;
  prevGesture = curGesture;

  // Zoom out — ease-in (cubic: slow → fast)
  if (curGesture === 'fist') {
    const t = Math.min(gestureTime / 1.6, 1.0);
    camRadius = Math.min(CAM_MAX, camRadius + (2 + t * t * t * 24) * dt);
  }

  // Zoom in — ease-out (quadratic: fast → slow)
  if (curGesture === 'open') {
    const t = Math.min(gestureTime / 1.6, 1.0);
    camRadius = Math.max(CAM_MIN, camRadius - (1.5 + (1 - t) * (1 - t) * 22) * dt);
  }

  if (planetMesh) planetMesh.rotation.y += 0.0014;

  gDist.textContent = `dist ${camRadius.toFixed(1)}`;
  positionCam();
  renderer.render(scene, cam);
}
animate();

// ── MediaPipe ─────────────────────────────────────────────────────
const videoEl  = document.getElementById('webcam');
const loadEl   = document.getElementById('loading');
const loadText = document.getElementById('load-text');

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
});
hands.setOptions({
  maxNumHands: 1, modelComplexity: 1,
  minDetectionConfidence: 0.7, minTrackingConfidence: 0.6,
});
hands.onResults(onResults);

loadText.textContent = 'Starting camera…';
new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width: 320, height: 240,
}).start()
  .then(() => {
    loadText.textContent = 'Ready ✓';
    setTimeout(() => {
      loadEl.style.opacity = '0';
      setTimeout(() => loadEl.remove(), 700);
    }, 500);
  })
  .catch(e => {
    loadText.textContent = 'Camera unavailable';
    setTimeout(() => { loadEl.style.opacity = '0'; setTimeout(() => loadEl.remove(), 700); }, 1200);
  });
</script>
</body>
</html>
