<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gesture Planet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #webcam {
      position: fixed; bottom: 14px; right: 14px;
      width: 150px; height: 112px;
      border-radius: 8px; opacity: 0.5;
      transform: scaleX(-1);
      border: 1px solid rgba(255,120,20,0.2);
      pointer-events: none;
    }
    #hud {
      position: fixed; top: 18px; left: 22px;
      font: 700 11px/2.2 'Courier New', monospace;
      color: rgba(255,150,40,0.5);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font: 11px 'Courier New', monospace;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.08em;
      white-space: nowrap;
      pointer-events: none;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      background: #000; z-index: 99;
      font: 12px 'Courier New', monospace;
      color: rgba(255,130,30,0.6);
      letter-spacing: 0.1em;
      transition: opacity 0.8s;
    }
    .spin {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,100,10,0.15);
      border-top-color: rgba(255,100,10,0.9);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading"><div class="spin"></div><div id="load-text">Loading…</div></div>
<video id="webcam" autoplay playsinline muted></video>
<div id="hud">
  Gesture Planet<br>
  <span id="g-label">—</span><br>
  <span id="g-dist"></span>
</div>
<div id="hint">🤚 3指 旋转 · ☝️ 4指 平移 · ✊ 握拳后退 拉远 · 🖐 5指前进 靠近</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ═══════════════════════════════════════
//  Renderer / scene
// ═══════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000409);

const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
});

// ── Camera orbit ────────────────────────────────────────
let θ = 0.2, φ = 1.2, R = 22;
const R_MIN = 8, R_MAX = 70;

function moveCam() {
  cam.position.set(
    R * Math.sin(φ) * Math.cos(θ),
    R * Math.cos(φ),
    R * Math.sin(φ) * Math.sin(θ)
  );
  cam.lookAt(0, 0, 0);
}
moveCam();

// ═══════════════════════════════════════
//  Shader factories
//  – Planet: large soft glowing blobs
//  – Ring:   tiny sharp crisp dots
// ═══════════════════════════════════════
function makeMat(sizeScale) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec3  aC;
      attribute float aS;
      varying   vec3  vC;
      void main(){
        vC = aC;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = aS * (${sizeScale.toFixed(1)} / -mv.z);
        gl_Position  = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vC;
      void main(){
        vec2  p = gl_PointCoord - .5;
        float d = dot(p,p)*4.;
        if(d>1.) discard;
        gl_FragColor = vec4(vC, pow(1.-d, 1.6)*0.95);
      }`,
  });
}

const matPlanet = makeMat(240); // large for glow
const matRing   = makeMat(90);  // small for fine particles

function pts(pos, col, siz, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aC',       new THREE.BufferAttribute(col, 3));
  g.setAttribute('aS',       new THREE.BufferAttribute(siz, 1));
  return new THREE.Points(g, mat);
}

// ═══════════════════════════════════════
//  Planet  (orange sphere of particles)
// ═══════════════════════════════════════
const PR = 5;
let planetMesh;

(function() {
  const N   = 20000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const roll = Math.random();

    // 80% surface shell, 14% interior, 6% haze
    let r;
    if      (roll < 0.80) r = PR * (0.93 + Math.random() * 0.09);
    else if (roll < 0.94) r = PR * (0.20 + Math.random() * 0.73);
    else                  r = PR * (1.02 + Math.random() * 0.20);

    const u = Math.random() * 2 * Math.PI;
    const v = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(v) * Math.cos(u);
    pos[i*3+1] = r * Math.cos(v);
    pos[i*3+2] = r * Math.sin(v) * Math.sin(u);

    // Core: yellow-white  →  surface: deep orange
    const n  = r / PR;
    const rr = 1.0;
    const gg = n < 0.5 ? 0.80 - n * 0.30 : Math.max(0.08, 0.65 - (n - 0.5) * 1.40);
    const bb = n < 0.45 ? (0.45 - n) * 0.60 : 0;

    const br = roll < 0.80 ? (0.7 + Math.random() * 0.3)
                           : (0.3 + Math.random() * 0.4);
    col[i*3]   = rr * br;
    col[i*3+1] = gg * br;
    col[i*3+2] = bb * br;

    siz[i] = 0.4 + Math.random() * 1.1;
  }

  planetMesh = pts(pos, col, siz, matPlanet);
  scene.add(planetMesh);
})();

// Atmospheric glow shells
for (const [sc, op, c] of [[1.40,0.055,0xff4400],[1.18,0.080,0xff5500],[0.90,0.075,0xff2200]]) {
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(PR * sc, 32, 32),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: op,
      side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending })
  ));
}

// ═══════════════════════════════════════
//  Rings  (fine white particle bands)
// ═══════════════════════════════════════
function buildRing({ rMin, rMax, tX, tZ, N, cr, cg, cb }) {
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const siz = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const a   = Math.random() * Math.PI * 2;
    const rad = rMin + Math.random() * (rMax - rMin);
    const h   = (Math.random() - 0.5) * 0.07;   // very flat

    pos[i*3]   = rad * Math.cos(a);
    pos[i*3+1] = h;
    pos[i*3+2] = rad * Math.sin(a);

    // Vary brightness per particle so they look individual
    const br = 0.25 + Math.random() * 0.55;
    col[i*3]   = cr * br;
    col[i*3+1] = cg * br;
    col[i*3+2] = cb * br;

    siz[i] = 0.4 + Math.random() * 1.1;  // keep small → crisp dots
  }

  const m = pts(pos, col, siz, matRing);
  m.rotation.x = tX;
  m.rotation.z = tZ;
  return m;
}

// Two bands, slightly different tilt, gap between them
scene.add(buildRing({ rMin: PR*1.5, rMax: PR*2.1, tX: 0.36, tZ: 0.05, N: 3800, cr:1.0, cg:1.0, cb:0.95 }));
scene.add(buildRing({ rMin: PR*2.4, rMax: PR*3.0, tX: 0.40, tZ: 0.08, N: 2800, cr:0.82,cg:0.88,cb:1.0  }));

// ── Stars ──────────────────────────────────────────────
{
  const N=5000, pos=new Float32Array(N*3), col=new Float32Array(N*3), siz=new Float32Array(N);
  for(let i=0;i<N;i++){
    const u=Math.random()*2*Math.PI, v=Math.acos(2*Math.random()-1), r=130+Math.random()*70;
    pos[i*3]=r*Math.sin(v)*Math.cos(u); pos[i*3+1]=r*Math.cos(v); pos[i*3+2]=r*Math.sin(v)*Math.sin(u);
    const b=0.3+Math.random()*0.7; col[i*3]=col[i*3+1]=col[i*3+2]=b;
    siz[i]=0.3+Math.random()*0.9;
  }
  scene.add(pts(pos,col,siz,matRing));
}

// ═══════════════════════════════════════
//  Planet group (planet + rings + glow)
//  wrapped so we can pan it as a unit
// ═══════════════════════════════════════
// (planet is already added to scene above;
//  we'll drive scene.position for pan)
let panX = 0, panY = 0;   // world-space pan offset applied to scene

// ═══════════════════════════════════════
//  Gesture state
// ═══════════════════════════════════════
let curGesture = 'none';
let prevPalmX  = null;    // screen-space palm X, for left/right tracking
let prevPalmSz = null;    // palm size proxy for zoom

let zoomVel = 0;

const gLabel = document.getElementById('g-label');
const gDist  = document.getElementById('g-dist');

function palmCenterX(lm) {
  // Mirror: webcam is mirrored, so x is already correct for screen coords
  return lm[0].x;   // wrist x in [0,1]
}
function palmSize(lm) {
  const dx = lm[9].x - lm[0].x, dy = lm[9].y - lm[0].y;
  return Math.sqrt(dx * dx + dy * dy);
}

function countExtended(lm) {
  return [
    lm[8].y  < lm[6].y,
    lm[12].y < lm[10].y,
    lm[16].y < lm[14].y,
    lm[20].y < lm[18].y,
  ].filter(Boolean).length;
}

function classify(lm) {
  const n = countExtended(lm);
  if (n <= 1) return 'fist';
  if (n === 3) return 'rotate';
  if (n === 4) return 'pan';
  return 'zoomin';   // 5 fingers
}

function onResults(res) {
  if (!res.multiHandLandmarks || !res.multiHandLandmarks.length) {
    curGesture = 'none'; prevPalmX = null; prevPalmSz = null;
    zoomVel *= 0.85;
    gLabel.textContent = '—'; return;
  }

  const lm = res.multiHandLandmarks[0];
  curGesture = classify(lm);
  const px   = palmCenterX(lm);
  const ps   = palmSize(lm);

  if (curGesture === 'rotate') {
    // 3 fingers, left/right → orbit camera (rotate planet view)
    if (prevPalmX !== null) {
      const dx = px - prevPalmX;    // positive = hand moved right in camera space
      θ += dx * 8.0;               // mirror: right hand move → planet rotates right
    }
    prevPalmX  = px;
    prevPalmSz = ps;

  } else if (curGesture === 'pan') {
    // 5 fingers, left/right → translate scene
    if (prevPalmX !== null) {
      const dx = px - prevPalmX;
      // Convert screen delta to world units (scale by distance)
      panX -= dx * R * 1.8;
    }
    prevPalmX  = px;
    prevPalmSz = ps;

  } else if (curGesture === 'fist') {
    // 握拳 + 手后退 → 拉远
    if (prevPalmSz !== null) {
      const shrink = prevPalmSz - ps;
      if (shrink > 0.001) zoomVel = Math.min(zoomVel + shrink * 180, 35);
    }
    prevPalmSz = ps; prevPalmX = null;

  } else if (curGesture === 'zoomin') {
    // 5指 + 手前进 → 靠近
    if (prevPalmSz !== null) {
      const grow = ps - prevPalmSz;
      if (grow > 0.001) zoomVel = Math.min(zoomVel, -(grow * 140));
    }
    prevPalmSz = ps; prevPalmX = null;

  } else {
    prevPalmX = px; prevPalmSz = ps;
  }

  const labels = { fist:'✊ 拉远', zoomin:'🖐 靠近 (5指)', rotate:'🤚 旋转 (3指)', pan:'☝️ 移动 (4指)' };
  gLabel.textContent = labels[curGesture] || '—';
}

// ═══════════════════════════════════════
//  Render loop
// ═══════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Apply zoom with inertia; ease-out naturally via velocity decay
  if (Math.abs(zoomVel) > 0.01) {
    R = Math.max(R_MIN, Math.min(R_MAX, R + zoomVel * dt));
    // Decay: faster near limits to prevent overshooting
    const limitFactor = curGesture === 'fist'
      ? (R_MAX - R) / R_MAX           // slows down as approaching max
      : (R - R_MIN) / (R_MAX - R_MIN);// slows down as approaching min
    zoomVel *= Math.max(0.82, 0.92 * limitFactor + 0.82 * (1 - limitFactor));
  } else {
    zoomVel = 0;
  }

  if (planetMesh) planetMesh.rotation.y += 0.0013;

  // Apply pan: smoothly lerp scene position toward panX
  scene.position.x += (panX - scene.position.x) * 0.12;

  gDist.textContent = `dist ${R.toFixed(1)}`;
  moveCam();
  renderer.render(scene, cam);
}
animate();

// ═══════════════════════════════════════
//  MediaPipe
// ═══════════════════════════════════════
const videoEl  = document.getElementById('webcam');
const loadEl   = document.getElementById('loading');
const loadText = document.getElementById('load-text');

function hideLoader() {
  loadEl.style.opacity = '0';
  setTimeout(() => loadEl.remove(), 750);
}

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.6 });
hands.onResults(onResults);

loadText.textContent = 'Starting camera…';
new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width: 320, height: 240,
}).start()
  .then(() => { loadText.textContent = 'Ready ✓'; setTimeout(hideLoader, 500); })
  .catch(e  => { loadText.textContent = 'No camera — planet still runs'; setTimeout(hideLoader, 1500); });
</script>
</body>
</html>
