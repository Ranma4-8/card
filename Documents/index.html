<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手势粒子交互</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05050f;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 135px;
      border-radius: 10px;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.5;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .hud-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }

    #gesture-label {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.05em;
      min-height: 30px;
      transition: color 0.3s;
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      pointer-events: none;
      white-space: nowrap;
    }

    #status {
      position: fixed;
      top: 20px;
      right: 200px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<video id="video" autoplay playsinline muted></video>

<div id="hud">
  <div class="hud-title">Gesture Particles</div>
  <div id="gesture-label">正在加载…</div>
</div>

<div id="hint">握拳 聚合 · 张手 分散 · 移动 引导</div>
<div id="status"></div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

// ─── Canvas setup ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const video  = document.getElementById('video');
const gestureLabel = document.getElementById('gesture-label');
const statusEl = document.getElementById('status');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Particle system ─────────────────────────────────────────────
const PARTICLE_COUNT = 350;
const particles = [];

const PALETTE = [
  [139, 92, 246],   // violet
  [99,  102, 241],  // indigo
  [59,  130, 246],  // blue
  [236, 72,  153],  // pink
  [52,  211, 153],  // emerald
];

class Particle {
  constructor() { this.reset(true); }

  reset(random = false) {
    this.x  = random ? Math.random() * canvas.width  : canvas.width  / 2;
    this.y  = random ? Math.random() * canvas.height : canvas.height / 2;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = (Math.random() - 0.5) * 1.5;
    this.size  = Math.random() * 2.5 + 0.8;
    this.alpha = Math.random() * 0.6 + 0.3;
    const c = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.r = c[0]; this.g = c[1]; this.b = c[2];
    this.baseVx = this.vx;
    this.baseVy = this.vy;
  }

  update(hands) {
    let ax = 0, ay = 0;

    for (const hand of hands) {
      const { cx, cy, gesture, dx, dy } = hand;
      // mirror x: landmarks are in video space (mirrored), canvas is normal
      const hx = (1 - cx) * canvas.width;
      const hy = cy * canvas.height;

      const distX = hx - this.x;
      const distY = hy - this.y;
      const dist  = Math.sqrt(distX * distX + distY * distY) + 1;

      if (gesture === 'fist') {
        // attract toward palm
        const strength = Math.min(300 / (dist * dist), 3);
        ax += (distX / dist) * strength * 4;
        ay += (distY / dist) * strength * 4;
      } else if (gesture === 'open') {
        // repel from palm
        const strength = Math.min(6000 / (dist * dist + 1), 5);
        ax -= (distX / dist) * strength;
        ay -= (distY / dist) * strength;
      } else if (gesture === 'move') {
        // guide: particles in radius follow palm direction
        if (dist < 200) {
          const influence = (1 - dist / 200) * 2.5;
          ax += dx * influence;
          ay += dy * influence;
        }
      }
    }

    this.vx = this.vx * 0.92 + ax * 0.08;
    this.vy = this.vy * 0.92 + ay * 0.08;

    // gentle drift when no hands / out of range
    if (hands.length === 0) {
      this.vx += (Math.random() - 0.5) * 0.05;
      this.vy += (Math.random() - 0.5) * 0.05;
      this.vx *= 0.98;
      this.vy *= 0.98;
    }

    // speed cap
    const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (spd > 12) { this.vx = (this.vx / spd) * 12; this.vy = (this.vy / spd) * 12; }

    this.x += this.vx;
    this.y += this.vy;

    // wrap around edges
    if (this.x < -10) this.x = canvas.width  + 10;
    if (this.x > canvas.width  + 10) this.x = -10;
    if (this.y < -10) this.y = canvas.height + 10;
    if (this.y > canvas.height + 10) this.y = -10;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.r},${this.g},${this.b},${this.alpha})`;
    ctx.fill();
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

// ─── Gesture detection ───────────────────────────────────────────
// landmarks: 0=wrist, 4=thumb tip, 8=index tip, 12=middle tip, 16=ring tip, 20=pinky tip
// knuckles (MCP): 5,9,13,17
function detectGesture(lm) {
  // For each finger: tip y < pip y means extended (in normalized coords, y↓)
  const fingers = [
    lm[8].y  < lm[6].y,   // index
    lm[12].y < lm[10].y,  // middle
    lm[16].y < lm[14].y,  // ring
    lm[20].y < lm[18].y,  // pinky
  ];
  const extended = fingers.filter(Boolean).length;

  if (extended <= 1) return 'fist';
  if (extended >= 3) return 'open';
  return 'move';
}

function palmCenter(lm) {
  // average of wrist + 4 MCP knuckles
  const pts = [lm[0], lm[5], lm[9], lm[13], lm[17]];
  return {
    x: pts.reduce((s, p) => s + p.x, 0) / pts.length,
    y: pts.reduce((s, p) => s + p.y, 0) / pts.length,
  };
}

// ─── Hand tracking state ─────────────────────────────────────────
let handStates = [];  // [{ cx, cy, gesture, dx, dy }]
let prevPalms  = [];

function processResults(results) {
  if (!results.landmarks || results.landmarks.length === 0) {
    handStates = [];
    prevPalms  = [];
    gestureLabel.textContent = '—';
    gestureLabel.style.color = 'rgba(255,255,255,0.3)';
    return;
  }

  const newStates = [];
  const newPalms  = [];

  results.landmarks.forEach((lm, i) => {
    const gesture = detectGesture(lm);
    const { x: cx, y: cy } = palmCenter(lm);
    const prev = prevPalms[i] || { x: cx, y: cy };
    const dx = (cx - prev.x) * 60;
    const dy = (cy - prev.y) * 60;
    newStates.push({ cx, cy, gesture, dx, dy });
    newPalms.push({ x: cx, y: cy });
  });

  handStates = newStates;
  prevPalms  = newPalms;

  // update label
  const labels = { fist: '✊ 聚合', open: '🖐 分散', move: '🤚 引导' };
  const colors  = { fist: '#a78bfa', open: '#34d399', move: '#f472b6' };
  const g = newStates[0].gesture;
  gestureLabel.textContent = labels[g] || g;
  gestureLabel.style.color = colors[g] || '#fff';
}

// ─── Draw hand skeleton overlay ──────────────────────────────────
function drawHands(results) {
  if (!results.landmarks) return;
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17],
  ];

  results.landmarks.forEach(lm => {
    ctx.save();
    ctx.globalAlpha = 0.35;

    // bones
    ctx.strokeStyle = '#818cf8';
    ctx.lineWidth = 1;
    for (const [a, b] of CONNECTIONS) {
      ctx.beginPath();
      ctx.moveTo((1 - lm[a].x) * canvas.width, lm[a].y * canvas.height);
      ctx.lineTo((1 - lm[b].x) * canvas.width, lm[b].y * canvas.height);
      ctx.stroke();
    }

    // joints
    lm.forEach((pt, idx) => {
      const r = [4, 8, 12, 16, 20].includes(idx) ? 4 : 2.5;
      ctx.beginPath();
      ctx.arc((1 - pt.x) * canvas.width, pt.y * canvas.height, r, 0, Math.PI * 2);
      ctx.fillStyle = '#c4b5fd';
      ctx.fill();
    });

    ctx.restore();
  });
}

// ─── Render loop ─────────────────────────────────────────────────
function render(results) {
  // dark fade trail
  ctx.fillStyle = 'rgba(5,5,15,0.22)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // particles
  particles.forEach(p => {
    p.update(handStates);
    p.draw();
  });

  // draw connections between nearby particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d  = dx * dx + dy * dy;
      if (d < 3600) { // 60px
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        const alpha = (1 - d / 3600) * 0.15;
        ctx.strokeStyle = `rgba(139,92,246,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  if (results) drawHands(results);
}

// ─── MediaPipe init ───────────────────────────────────────────────
let handLandmarker = null;
let lastVideoTime  = -1;
let latestResults  = null;

async function init() {
  statusEl.textContent = '加载模型中…';
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate: 'GPU',
    },
    runningMode: 'VIDEO',
    numHands: 2,
  });

  statusEl.textContent = '启动摄像头…';
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);

  statusEl.textContent = '';
  gestureLabel.textContent = '—';

  requestAnimationFrame(loop);
}

function loop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime  = video.currentTime;
    latestResults  = handLandmarker.detectForVideo(video, performance.now());
    processResults(latestResults);
  }
  render(latestResults);
  requestAnimationFrame(loop);
}

init().catch(err => {
  statusEl.textContent = '启动失败：' + err.message;
  gestureLabel.textContent = '❌';
  // still run particle animation without hands
  function idleLoop() { render(null); requestAnimationFrame(idleLoop); }
  idleLoop();
});
</script>
</body>
</html>
